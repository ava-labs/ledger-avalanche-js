name: Publish Package

on:
  pull_request:
    branches:
      - main
      - develop
      - release/*
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write # Required for npm OIDC trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        # node-version is required: without it the job inherits the runner default
        # (Node 22 / npm 10.9.x), and npm 10 has no OIDC support whatsoever.
        # Node 24 ships npm 11.x, which satisfies the >= 11.5.1 requirement.
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm supports trusted publishing
        # Fail loudly and early. Without this an unsupported npm produces a bare
        # `404 Not Found - PUT` at the very end of the run, which reads like a
        # missing package rather than an authentication problem.
        run: |
          NPM_VERSION="$(npm --version)"
          REQUIRED="11.5.1"
          echo "node $(node --version) / npm ${NPM_VERSION}"
          if [ "$(printf '%s\n%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -n1)" != "$REQUIRED" ]; then
            echo "::error::npm ${NPM_VERSION} is too old for OIDC trusted publishing (need >= ${REQUIRED})"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Set package.json version from tag
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Publishing version ${VERSION}"
          npm --allow-same-version --no-git-tag-version version "${VERSION}"

      - name: Drop placeholder auth token so OIDC is used
        # setup-node unconditionally writes `_authToken=${NODE_AUTH_TOKEN}` into
        # .npmrc whenever registry-url is set. With no token supplied that resolves
        # to the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`, and npm sends it as
        # a real bearer token instead of performing the OIDC exchange. The registry
        # then answers `404 Not Found - PUT` (it masks 403 on scoped packages).
        # See actions/setup-node#1551.
        if: github.event_name == 'release'
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Publish to npm (OIDC trusted publisher)
        # No NODE_AUTH_TOKEN by design: authentication is the OIDC exchange, which
        # also generates the provenance attestation automatically.
        if: github.event_name == 'release'
        run: npm publish --access public
